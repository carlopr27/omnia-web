<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memora · Tus recuerdos</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><span>MEMORA</span><small>MVP 0.2A</small></header><h1>Un recuerdo, con tu voz.</h1><p>Graba tu respuesta en video. Hasta 3 minutos.</p>
<section><h2 id="question">Cargando preguntas…</h2><button id="another" disabled>Otra pregunta</button><p id="timer">00:00 / 03:00</p><video id="preview" playsinline controls hidden></video><div class="actions"><button id="record" disabled>Grabar mi respuesta</button><button id="stop" hidden>Terminar</button><button id="save" hidden>Guardar video en Drive</button><button id="retake" hidden>Grabar otra vez</button></div><p id="notice" role="status" aria-live="polite"></p></section>
<section id="memory" hidden><h2 id="memoryQuestion"></h2><p id="status" role="status" aria-live="polite"></p><iframe id="driveVideo" title="Video guardado en Drive" allow="autoplay; fullscreen" allowfullscreen></iframe><p><a id="driveLink" target="_blank" rel="noopener">Abrir video en Drive</a></p><h3>Transcripción</h3><p id="transcript">Esperando la transcripción…</p><button id="retry" hidden>Reintentar transcripción</button><button id="refresh" hidden>Consultar de nuevo</button><button id="newMemory">Grabar otro recuerdo</button></section>
<footer>Tu video se guarda en Drive y se envía a AssemblyAI para transcribirlo.</footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
