:root{--ink:#173a38;--accent:#24736b;--muted:#62716d;--line:#d8e0db;--paper:#fff;--bg:#f3f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:30px;letter-spacing:7px;font-weight:500}.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}main{max-width:1120px;margin:46px auto;padding:0 24px}.layout{display:grid;grid-template-columns:265px 1fr;gap:44px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font-size:clamp(30px,4vw,46px);line-height:1.15;font-weight:500;margin:16px 0 24px}h2{font-size:27px;line-height:1.25;margin:8px 0 12px;font-weight:550}p{margin:10px 0 20px}.muted,small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 8px 30px #173a3805}.login{max-width:510px;margin:auto}.loginIntro{max-width:680px;margin:0 auto 28px;text-align:center}.pill{display:inline-block;font-size:12px;padding:5px 12px;border-radius:30px;background:#e6eeea;color:var(--ink)}label{cursor:pointer}input,select,textarea,button{font:inherit}input[type=text],input[type=email],input[type=number],select,textarea{width:100%;border:1px solid #adbdb5;border-radius:9px;padding:12px;color:var(--ink);background:white}textarea{min-height:100px;resize:vertical}input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #77b8ae;outline-offset:3px}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:19px;height:19px;flex:none}button{border:0;border-radius:9px;padding:12px 19px;cursor:pointer;background:var(--ink);color:white;font-weight:600;min-height:46px}button:hover{filter:brightness(1.12)}bu us:5px}.progressText{display:flex;justify-content:space-between;font-size:13px}.split{display:grid;grid-template-columns:1fr 100px;gap:16px;align-items:center;margin:12px 0}.review{border-bottom:1px solid var(--line);padding:16px 0}.review dt{font-size:13px;color:var(--muted)}.review dd{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.success{text-align:center;max-width:720px;margin:auto}.check{font-size:36px;border-radius:50%;background:#e6eee6;display:inline-grid;place-items:center;width:76px;height:76px;margin:12px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}footer{max-width:1120px;margin:30px auto;padding:0 24px 26px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){header{padding:16px 20px}.tag{letter-spacing:1px;font-size:10px}main{margin-top:25px;padding:0 16px}.layout{display:block}.steps{display:flex;margin:16px 0;gap:7px}.steps li{padding:0}.stepName{display:none}.card{padding:22px 18px}.options{grid-template-columns:1fr}aside h2{font-size:21px}aside>p{display:none}.scale{gap:7px}h1{font-size:34px}}

ng:0 20px 8px;font-size:10px;max-width:1040px}.flow .review{padding:10px 0}.flow .review dd{font-size:14px}button,input,select,textarea{-webkit-tap-highlight-color:transparent}html{scroll-padding-bottom:16px}

<body>
<header><div class="logo" aria-label="SEGLE">SEGLE</div><div class="tag">Conexión distribuidores<br>Diagnóstico comercial · Demo</div></header>
<main id="app"></main><footer>Prototipo local · Inspiración visual SEGLE · Sin conexión a servicios externos.</footer>
<script>
'use strict';
const VERSION='SEGLE-DIAGNOSTICO-V3-DEMO',KEY=VERSION+'-borrador';
const app=document.getElementById('app');
let state={answers:{},step:0,startedAt:new Date().toISOString(),completedAt:null},storageOK=true;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>state.answers[id]??'';
const has=(id,v)=>Array.isArray(val(id))&&val(id).includes(v);
const low=id=>['1','2'].includes(String(val(id)));
const team=()=>val('team')==='Sí';
const clients=()=>val('clientData')==='Puedo dar una estimación'&&Number(val('clients'))>0;
const lead=()=>['Sí','Tengo una oportunidad, pero aún no sé su potencial'].includes(val('lead'));
const channels=['Consultorios médicos','Clínicas / centros dermatológicos','Farmacias'];
const supports=['Capacitación de producto','Materiales de visita y venta','Muestras / testers','Acompañamiento en visitas comerciales','Acciones para dar a conocer la marca','Revisión de condiciones comerciales','Apoyo en inventario y reposición'];
const sections=['Identificación','Negocio y clientes','Equipo de ventas','Capacidad comercial','Barreras y productos','Oportunidad de crecimiento','Prioridades y cierre'];
const fields=[];
function add(section,id,label,type='text',options=[],extra={}){fields.push({section,id,label,type,options,required:true,...extra});}
add(0,'id','ID de distribuidor','short',[],{required:false,hint:'Completa tu ID o tu nombre comercial; puedes incluir ambos.'});
add(0,'name','Nombre del distribuidor / nombre comercial','short',[],{required:false});
add(0,'email','Correo de contacto','email');
add(0,'contact','Nombre y puesto de quien responde','short');
add(1,'territory','¿En qué ciudades o zonas operas?','text');
add(1,'business','Cuéntanos cómo funciona tu distribuidora: qué vendes, a quién atiendes y cómo organizas la venta.','text',[],{hint:'Queremos entender tu operación y el lugar que ocupa SEGLE en ella.'});
add(1,'channels','¿A qué tipo de clientes vendes actualmente SEGLE?','multi',[...channels,'Todavía no tengo clientes SEGLE'],{exclusive:'Todavía no tengo clientes SEGLE'});
add(1,'trend','En los últimos 12 meses, ¿cómo han evolucionado tus ventas de SEGLE?','radio',['Creciendo más de 20%','Creciendo entre 5% y 20%','Relativamente estables (variación menor a 5%)','Bajando entre 5% y 20%','Bajando más de 20%','No tengo suficiente información']);
add(1,'trendWhy','¿A qué atribuyes la caída y qué has intentado para recuperarte?','text',[],{when:()=>String(val('trend')).startsWith('Bajando'),hint:'Aparece porque indicaste una caída en ventas.'});
add(1,'clientData','Sobre tu cartera SEGLE de los últimos 12 meses:','radio',['Puedo dar una estimación','No tengo esta información disponible'],{hint:'Considera clientes distintos que te compraron SEGLE en ese periodo; cuenta cada cuenta comercial una sola vez.'});
add(1,'clients','¿Cuántos clientes te compraron SEGLE en los últimos 12 meses?','number',[],{when:()=>val('clientData')==='Puedo dar una estimación',min:0});
add(1,'c50','¿Cuántos clientes concentran aproximadamente el 50% de tu facturación SEGLE?','number',[],{when:clients,min:1,hint:'Ordénalos de mayor a menor compra y cuenta el mínimo de clientes necesario para alcanzar al menos el 50% de las ventas del mismo periodo.'});
add(1,'c80','¿Cuántos clientes concentran aproximadamente el 80% de tu facturación SEGLE?','number',[],{when:clients,min:1,hint:'Usa el mismo orden y periodo. Este grupo incluye a los clientes que concentran el 50%.'});
add(1,'concentration','¿Qué tan dependiente te sientes de esos clientes principales y cómo cuidas o diversificas esa cartera?','text',[],{when:clients,required:false});
add(1,'dataHelp','¿Qué te dificulta conocer tu cartera y concentración de ventas?','text',[],{when:()=>val('clientData')==='No tengo esta información disponible'});
add(2,'team','¿Tienes un equipo de ventas propio, además de ti?','radio',['Sí','No']);
add(2,'teamSize','¿Cuántas personas integran tu equipo de ventas propio?','number',[],{when:team,min:1,hint:'Sin contarte a ti. Incluye a quienes realizan venta activa.'});
add(2,'segleSellers','De ellas, ¿cuántas venden SEGLE activamente?','number',[],{when:team,min:0});
add(2,'dedication','¿Cómo se distribuye la dedicación del equipo que vende SEGLE?','radio',['Solo vende SEGLE','Combina SEGLE con otras marcas','Actualmente nadie del equipo vende SEGLE'],{when:team});
add(2,'teamOrganization','¿Cómo organizas a tu equipo: zonas, cartera, prospección y seguimiento de clientes?','text',[],{when:team});
add(2,'motivation','¿Qué motiva a tus vendedores a ofrecer SEGLE y qué hace que prioricen otras marcas?','text',[],{when:team,hint:'Puedes hablar de comisiones, metas, facilidad de venta, demanda, confianza o tiempo disponible.'});
add(2,'teamChallenge','¿Qué se le complica más a tu equipo al vender SEGLE? Cuéntanos un ejemplo reciente.','text',[],{when:team});
add(2,'solo','¿Quién realiza la venta y el seguimiento de SEGLE? ¿Qué limita su tiempo o capacidad para crecer?','text',[],{when:()=>val('team')==='No'});
add(2,'routine','¿Cómo revisas los resultados, oportunidades y necesidades de tu operación comercial?','text',[],{hint:'Por ejemplo: reuniones, metas, visitas, recompra, cotizaciones o alguna herramienta de seguimiento.'});
const ratings=[['knowledge','Conocemos el portafolio SEGLE lo suficiente para presentarlo correctamente.','¿Qué productos o temas generan dudas? ¿Qué necesitas para sentir más confianza?'],['arguments','Podemos explicar con claridad los beneficios y diferencias de los productos SEGLE.','¿Qué beneficios o diferencias son difíciles de explicar? Cuéntanos una objeción frecuente.'],['recommend','Sabemos qué productos ofrecer según el perfil de cada consultorio, clínica o farmacia.','¿En qué tipo de cliente o situación resulta difícil elegir qué ofrecer?'],['tools','Contamos con herramientas comerciales suficientes para desarrollar SEGLE.','¿Qué herramientas te faltan y en qué momento de la venta las usarías?'],['portfolio','El portafolio SEGLE responde a las necesidades de nuestros clientes.','¿Qué necesidades de tus clientes no estás pudiendo cubrir?'],['terms','Las condiciones comerciales de SEGLE nos permiten competir en nuestro mercado.','¿Qué condición dificulta competir y qué cambio concreto te ayudaría?'],['support','Recibimos el apoyo de SEGLE que necesitamos para crecer.','¿Qué apoyo has necesitado y no has recibido, o qué debería funcionar mejor?']];
ratings.forEach(([id,label,why])=>{add(3,id,label,'scale',[],{hint:'Responde pensando en ti y en quienes venden SEGLE contigo.'});add(3,id+'Why',why,'text',[],{when:()=>low(id),hint:'Elegiste 1 o 2. Queremos entender el motivo y cómo ayudarte.'});});
add(4,'barriers','¿Qué factores limitan que vendas más SEGLE?','multi',['Poco conocimiento de la marca','Captación de nuevos clientes','Capacitación','Herramientas comerciales','Condiciones comerciales / margen','Inventario / disponibilidad','Baja rotación en clientes','Tiempo o dedicación del equipo','Otra','Ninguna por ahora'],{max:4,exclusive:'Ninguna por ahora',hint:'Elige hasta 4 barreras.'});
add(4,'otherBarrier','¿Qué otra barrera enfrentas?','text',[],{when:()=>has('barriers','Otra')});
add(4,'barrierStory','De las barreras que seleccionaste, ¿cuál pesa más y cómo se presenta en tu día a día?','text',[],{when:()=>Array.isArray(val('barriers'))&&val('barriers').length>0&&!has('barriers','Ninguna por ahora'),hint:'Describe un caso concreto, qué intentaste y qué pasó.'});
add(4,'training','¿Qué capacitación sería más útil para ti o tu equipo?','multi',['Portafolio','Diferenciadores y argumentos','Selección de productos por cliente','Prospección y cierre','Seguimiento y recompra'],{when:()=>low('knowledge')||low('arguments')||low('recommend')||has('barriers','Capacitación')});
add(4,'hardProducts','¿Qué productos SEGLE te cuesta vender y por qué?','text',[],{required:false});
add(4,'easyProducts','¿Qué productos funcionan mejor y qué podemos aprender de esa venta?','text',[],{required:false});
add(5,'lead','¿Tienes un prospecto que, por sí solo, podría aumentar tu facturación SEGLE alrededor de un 5–10% si se convierte en cliente?','radio',['Sí','Tengo una oportunidad, pero aún no sé su potencial','No'],{hint:'Compara su compra estimada durante un año con tu facturación SEGLE de los últimos 12 meses. Es una estimación, no un compromiso.'});
add(5,'leadProfile','Describe ese prospecto: tipo de cuenta, zona y por qué es una oportunidad importante.','text',[],{when:lead,hint:'Puedes usar un alias; no es necesario incluir datos personales de terceros.'});
add(5,'leadStage','¿En qué etapa está la oportunidad?','radio',['Identificado, sin contacto','Primer contacto realizado','Presentación o demostración','Propuesta / cotización enviada','Negociación / decisión final'],{when:lead});
add(5,'leadPotential','¿Qué aumento de facturación SEGLE estimas que generaría por sí solo?','radio',['Menos de 5%','Entre 5% y 10%','Más de 10%','Aún no puedo estimarlo'],{when:lead});
add(5,'leadBasis','¿En qué basas esa estimación?','text',[],{when:()=>lead()&&val('leadPotential')!==''&&val('leadPotential')!=='Aún no puedo estimarlo',hint:'Por ejemplo: sucursales, volumen esperado, frecuencia de compra o conversaciones previas.'});
add(5,'leadBlock','¿Qué impide que se convierta en cliente y qué necesitas para lograrlo?','text',[],{when:lead,hint:'Distingue qué puedes hacer tú y en qué necesitas apoyo de SEGLE.'});
add(5,'leadAction','¿Cuál sería el siguiente paso, quién lo impulsaría y en qué plazo?','text',[],{when:lead});
add(5,'prospectHelp','¿Qué tipo de cliente te gustaría captar y qué necesitas para encontrar o desarrollar oportunidades de ese tamaño?','text',[],{when:()=>val('lead')==='No'});
add(6,'rank1','Primera prioridad de apoyo','select',supports);
add(6,'rank2','Segunda prioridad de apoyo','select',supports);
add(6,'rank3','Tercera prioridad de apoyo','select',supports,{hint:'Selecciona tres apoyos distintos; la primera prioridad es la más importante.'});
add(6,'action','Si SEGLE pudiera hacer una sola cosa por tu distribuidora en los próximos 90 días, ¿qué debería ser y qué cambiaría para ti?','text');
add(6,'comments','¿Qué más deberíamos entender sobre tu negocio, tu equipo o tu relación con SEGLE?','text',[],{required:false,hint:'Este espacio es tuyo. Comparte lo que no hayamos preguntado.'});
add(4,'mostMoved','¿Qué productos SEGLE mueves más y por qué?','text');
add(4,'leastMoved','¿Qué productos SEGLE mueves menos y por qué?','text');
add(4,'productTraining','¿Sobre qué productos o gamas SEGLE te falta formación?','text');
add(4,'catalogInfo','¿Qué tipo de información te ayudaría a mover mejor el catálogo SEGLE?','text',[],{hint:'Por ejemplo: fichas de producto, ingredientes, beneficios, diferencias entre gamas, argumentos de venta o materiales de consulta.'});
add(4,'indications','¿Conoces para qué necesidad de la piel o patología está indicado cada producto o gama SEGLE?','radio',['Sí, de todo el catálogo','De algunos productos o gamas','No estoy seguro/a']);
add(4,'indicationsWhy','¿En qué productos, gamas o necesidades de la piel tienes dudas?','text',[],{when:()=>['De algunos productos o gamas','No estoy seguro/a'].includes(val('indications'))});
add(4,'combinations','¿Sabes cómo combinar los productos SEGLE en una rutina?','radio',['Sí, con seguridad','Solo algunas combinaciones','No, necesito formación']);
add(4,'combinationsWhy','¿Qué combinaciones te generan dudas o te gustaría aprender?','text',[],{when:()=>['Solo algunas combinaciones','No, necesito formación'].includes(val('combinations'))});
fields.sort((a,b)=>a.section-b.section);
fields.forEach(f=>f.required=false);
const visible=f=>!f.when||f.when();
function clean(){fields.forEach(f=>{if(!visible(f))delete state.answers[f.id];});}
function save(){state.version=VERSION;state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}const el=document.getElementById('saved');if(el)el.textContent=storageOK?'Borrador guardado en este navegador':'No se pudo guardar. Conserva esta pestaña abierta y descarga el CSV al terminar.';}
function errorFor(f){const v=val(f.id);if(!visible(f))return '';if(f.required&&(Array.isArray(v)?v.length===0:!String(v).trim()))return 'Completa esta respuesta para continuar.';if(!String(v).trim())return '';if(f.type==='number'&&(!Number.isSafeInteger(Number(v))||Number(v)<(f.min??0)))return 'Introduce un número entero de al menos '+(f.min??0)+'.';if(f.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return 'Introduce un correo válido.';if(['radio','select'].includes(f.type)&&!f.options.includes(v))return 'Selecciona una opción válida.';if(f.type==='scale'&&!['1','2','3','4','5'].includes(String(v)))return 'Selecciona del 1 al 5.';if(f.type==='multi'&&(!Array.isArray(v)||v.some(x=>!f.options.includes(x))||v.length>(f.max||99)))return 'Revisa las opciones seleccionadas.';if(f.id==='c50'&&Number(v)>Number(val('clients')))return 'No puede superar el total de clientes.';if(f.id==='c80'&&(Number(v)>Number(val('clients'))||Number(v)<Number(val('c50'))))return 'Debe ser igual o mayor que los clientes del 50% y no superar el total.';if(f.id==='segleSellers'&&Number(v)>Number(val('teamSize')))return 'No puede superar el tamaño de tu equipo.';if(f.id==='dedication'&&((Number(val('segleSellers'))===0)!==(v==='Actualmente nadie del equipo vende SEGLE')))return 'La dedicación debe coincidir con el número de vendedores activos de SEGLE.';if(f.id.startsWith('rank')&&fields.filter(x=>x.id.startsWith('rank')&&x.id!==f.id).some(x=>val(x.id)===v))return 'Cada prioridad debe ser distinta.';return '';}
function validate(step){if(step===0&&!String(val('id')).trim()&&!String(val('name')).trim())return {id:'id',message:'Escribe tu ID o el nombre de tu distribuidora.'};for(const f of fields.filter(f=>f.section===step)){const message=errorFor(f);if(message)return {id:f.id,message};}return null;}
function progress(){const required=fields.filter(f=>visible(f)&&f.required);const done=required.filter(f=>!errorFor(f)).length;return Math.round((done+(!!String(val('id')).trim()||!!String(val('name')).trim()?1:0))/(required.length+1)*100);}
function fieldHTML(f){const v=val(f.id);let input='';if(f.type==='text')input=`<textarea id="${f.id}" name="${f.id}" maxlength="6000" placeholder="Cuéntanos con el detalle que necesites…">${esc(v)}</textarea>`;else if(['short','email','number'].includes(f.type))input=`<input id="${f.id}" name="${f.id}" type="${f.type==='short'?'text':f.type}" ${f.type==='number'?`min="${f.min??0}" step="1"`:'maxlength="200"'} value="${esc(v)}">`;else if(f.type==='select')input=`<select id="${f.id}" name="${f.id}"><option value="">Selecciona un apoyo</option>${f.options.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;else if(f.type==='scale')input=`<div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${f.id}" value="${n}" ${String(v)===String(n)?'checked':''} aria-label="${n} de 5"><span>${n}</span></label>`).join('')}</div><div class="ends"><span>1 · Totalmente en desacuerdo</span><span>5 · Totalmente de acuerdo</span></div>`;else input=`<div class="options">${f.options.map(x=>`<label class="option"><input type="${f.type==='multi'?'checkbox':'radio'}" name="${f.id}" value="${esc(x)}" ${f.type==='multi'?(has(f.id,x)?'checked':''):(v===x?'checked':'')}><span>${esc(x)}</span></label>`).join('')}</div>`;return `<fieldset id="field-${f.id}"><legend>${esc(f.label)}</legend><p class="hint">${f.required?'Obligatoria':'Opcional'}${f.when?' · Según tus respuestas':''}${f.type==='text'?' · Hasta 6,000 caracteres':''}${f.hint?' · '+esc(f.hint):''}</p>${input}</fieldset>`;}
function entries(){return fields.map(f=>[f.label,visible(f)?(Array.isArray(val(f.id))?val(f.id).join(' | '):val(f.id)):'No aplica']);}
function review(){return '<p class="note">Revisa tus respuestas. Usa los bloques del menú para editar. Al finalizar podrás descargar tu CSV; no se enviará automáticamente.</p><dl>'+entries().filter(x=>x[1]!=='No aplica').map(([k,v])=>`<div class="review"><dt>${esc(k)}</dt><dd>${esc(v||'Sin respuesta')}</dd></div>`).join('')+'</dl>';}
function updateProgress(){document.getElementById('progress').value=progress();document.getElementById('pct').textContent=progress()+'%';}
function showError(e){document.getElementById('error').textContent=e.message;const el=document.getElementById('field-'+e.id);el?.scrollIntoView({block:'center',behavior:'smooth'});el?.querySelector('input,textarea,select')?.focus({preventScroll:true});}
function render(focus=false){const titles=[...sections,'Revisión'];app.innerHTML=`<div class="layout"><aside><span class="eyebrow">Tu perspectiva cuenta</span><h2>${esc(val('name')||val('id')||'Conozcamos tu negocio')}</h2><p class="muted">Queremos entender lo que pasa en tu distribuidora y con quienes venden contigo.</p><ol class="steps">${titles.map((t,i)=>`<li class="${state.step===i?'active':''}"><button class="link" data-step="${i}" aria-label="Ir a ${esc(t)}" ${state.step===i?'aria-current="step"':''}><b>${i+1}</b> <span class="stepName">${esc(t)}</span></button></li>`).join('')}</ol><div class="progressText"><span>Respuestas obligatorias</span><strong id="pct"></strong></div><progress id="progress" max="100" aria-label="Progreso"></progress><p class="hint" role="status" id="saved">${storageOK?'Guardado automático en este navegador':'Guardado local no disponible; descarga al finalizar.'}</p><button class="link" id="home">Guardar y volver al inicio</button></aside><section class="card"><span class="eyebrow">Paso ${state.step+1} de 8</span><h2 id="heading" tabindex="-1">${titles[state.step]}</h2><p class="hint">${state.step===3?'Si eliges 1 o 2, se abrirá un espacio para explicar el motivo.':state.step===1?'Las cifras de clientes y facturación se refieren a SEGLE en los últimos 12 meses.':'Tus respuestas harán aparecer preguntas de seguimiento cuando correspondan.'}</p><form id="survey" novalidate>${state.step===7?review():fields.filter(f=>f.section===state.step&&visible(f)).map(fieldHTML).join('')}<p id="error" class="error" role="alert"></p><div class="nav"><button id="back" type="button" class="secondary" ${state.step===0?'disabled':''}>← Anterior</button><button type="submit">${state.step===7?'Finalizar y preparar CSV':'Continuar →'}</button></div></form></section></div>`;fields.forEach(f=>{const el=document.getElementById(f.id);if(el)el.setAttribute('aria-label',f.label);});updateProgress();document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=Number(b.dataset.step);save();render(true);});document.getElementById('home').onclick=()=>{save();welcome();};document.getElementById('back').onclick=()=>{state.step--;save();render(true);};document.getElementById('survey').addEventListener('input',capture);document.getElementById('survey').onsubmit=e=>{e.preventDefault();if(state.step===7){for(let i=0;i<7;i++){const err=validate(i);if(err){state.step=i;render();showError(err);return;}}state.completedAt=new Date().toISOString();save();complete();return;}const err=validate(state.step);if(err){showError(err);return;}state.step++;save();render(true);};if(focus){document.getElementById('heading').focus();window.scrollTo(0,0);}}
function capture(e){const t=e.target,f=fields.find(f=>f.id===t.name);if(!f)return;const before=fields.filter(visible).map(f=>f.id).join('|');let v=t.value;if(f.type==='multi'){v=Array.isArray(val(f.id))?[...val(f.id)]:[];v=t.checked?[...new Set([...v,t.value])]:v.filter(x=>x!==t.value);if(f.exclusive){if(t.checked&&t.value===f.exclusive)v=[t.value];else v=v.filter(x=>x!==f.exclusive);}if(v.length>(f.max||99)){t.checked=false;document.getElementById('error').textContent='Selecciona un máximo de '+f.max+' opciones.';return;}}state.answers[f.id]=v;clean();save();const after=fields.filter(visible).map(f=>f.id).join('|');if(before!==after||f.type==='multi'){const pos=window.scrollY;render();const target=Array.from(document.getElementsByName(f.id)).find(x=>x.value===t.value)||document.getElementsByName(f.id)[0];target?.focus({preventScroll:true});window.scrollTo(0,pos);}else{updateProgress();document.getElementById('error').textContent='';}}
function csvCell(v){let s=String(v??'');if(/^\s*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function buildCSV(){const date=new Date(state.completedAt);const all=[['Versión',VERSION],['Inicio UTC',state.startedAt],['Finalización UTC',state.completedAt],['Fecha y hora local',date.toLocaleString('es-MX')],['Zona horaria',Intl.DateTimeFormat().resolvedOptions().timeZone],...entries()];return '\uFEFF'+all.map(x=>csvCell(x[0])).join(',')+'\r\n'+all.map(x=>csvCell(x[1])).join(',')+'\r\n';}
function download(){const url=URL.createObjectURL(new Blob([buildCSV()],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='SEGLE_'+String(val('id')||val('name')||'DEMO').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,60)+'_'+state.completedAt.replace(/[:.]/g,'-')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('downloadStatus').textContent='Descarga solicitada. Revisa tu carpeta de descargas.';}
function complete(){app.innerHTML=`<section class="card success"><span class="eyebrow">Diagnóstico completado</span><div class="check">✓</div><h1>Gracias por abrirnos<br>la puerta a tu negocio.</h1><p>Las respuestas de <strong>${esc(val('name')||val('id')||'Demo sin identificación')}</strong> están listas para descargar y compartir con SEGLE.</p><p class="note">${storageOK?'Guardadas en este navegador.':'No se pudo guardar: descarga el CSV antes de cerrar.'} No se ha enviado información a SEGLE.</p><div class="actions"><button id="download">Descargar CSV ↓</button><button id="edit" class="secondary">Revisar / editar</button></div><p class="hint">Compatible con Excel. Si aparece en una sola columna, importa como UTF-8 y separador coma.</p><p id="downloadStatus" class="hint" role="status"></p><button id="home" class="link">Volver al inicio</button></section>`;document.getElementById('download').onclick=download;document.getElementById('edit').onclick=()=>{state.completedAt=null;state.step=fields.filter(visible).length;save();render(true);};document.getElementById('home').onclick=welcome;window.scrollTo(0,0);}
function welcome(){const existing=Object.keys(state.answers).length>0||state.step>0||!!state.completedAt;app.innerHTML=`<div class="loginIntro"><span class="eyebrow">Escuchar. Entender. Crecer.</span><h1>Tu negocio, tu equipo.<br>Tu siguiente oportunidad.</h1><p class="muted">Cuéntanos cómo funciona tu distribuidora, qué frena las ventas y dónde podemos ayudarte a crecer.</p><span class="pill">Demo · Una pregunta a la vez</span></div><section class="card login"><h2>${existing?'Tu diagnóstico está guardado':'Empecemos por conocerte'}</h2><p>${existing?'Hay respuestas de '+esc(val('name')||val('id')||'un distribuidor')+' en este navegador.':'Todas las preguntas son opcionales en este demo, incluidos tus datos de identificación.'}</p><p class="note">Las preguntas se adaptan a tus respuestas. Si calificas un aspecto con 1 o 2, te preguntaremos por qué. Puedes avanzar sin contestar y volver cuando quieras.</p><button id="start" style="width:100%">${existing?(state.completedAt?'Ver resultados':'Continuar borrador'):'Comenzar →'}</button>${existing?'<button id="new" class="link">Borrar este borrador e iniciar otro distribuidor</button>':''}<p class="hint">Sin contraseña. Este archivo guarda un borrador en este navegador, no envía respuestas. Al finalizar, descarga el CSV y compártelo con tu contacto de SEGLE. En un dispositivo compartido, otras personas podrían ver el borrador.</p></section>`;document.getElementById('start').onclick=()=>state.completedAt?complete():render(true);if(existing)document.getElementById('new').onclick=()=>{if(confirm('¿Borrar las respuestas guardadas? Descarga antes el CSV si quieres conservarlas.')){state={answers:{},step:0,startedAt:new Date().toISOString(),completedAt:null};save();render(true);}};}
// Flujo demo: todas las respuestas son opcionales y ninguna validación bloquea la navegación.
function validate(){return null;}
function progress(){return Math.round(Math.min(state.step,fields.filter(visible).length)/fields.filter(visible).length*100);}
function review(){return '<p class="note">Puedes finalizar aunque hayas dejado preguntas sin responder. El CSV incluirá los espacios vacíos y marcará las preguntas no aplicables.</p><dl>'+fields.filter(visible).map(f=>`<div class="review"><dt>${esc(f.label)}</dt><dd>${esc(Array.isArray(val(f.id))?val(f.id).join(' | '):val(f.id)||'Sin respuesta')}</dd><button type="button" class="link" data-edit="${f.id}">Editar respuesta</button></div>`).join('')+'</dl>';}
function render(focus=false){const route=fields.filter(visible);state.step=Math.max(0,Math.min(state.step,route.length));const f=route[state.step],isReview=!f;app.innerHTML=`<div class="flow"><div class="flowTop"><span class="eyebrow">${isReview?'Revisión final':esc(sections[f.section])}</span><span class="pill">Demo · Todo opcional</span></div><div class="progressText"><span>${isReview?'Recorrido completado':'Pregunta '+(state.step+1)+' de '+route.length}</span><strong id="pct"></strong></div><progress id="progress" max="100" aria-label="Avance del recorrido"></progress><p class="hint">El recorrido se adapta a tus respuestas.</p><details><summary>Ir a un bloque</summary>${sections.map((s,i)=>`<button type="button" class="link" data-section="${i}">${esc(s)}</button>`).join('')}<button type="button" class="link" data-section="7">Revisión final</button></details><section class="card"><form id="survey" novalidate>${isReview?'<h2 id="heading" tabindex="-1">Revisa tu diagnóstico</h2>'+review():fieldHTML(f)}<p id="error" class="hint" role="status"></p><div class="nav"><button id="back" type="button" class="secondary" ${state.step===0?'disabled':''}>← Anterior</button>${!isReview?'<button id="clear" type="button" class="link">Borrar respuesta</button>':''}<button type="submit">${isReview?'Finalizar y preparar CSV':'Continuar →'}</button></div><p class="hint">${isReview?'No se enviarán respuestas automáticamente.':'Puedes continuar sin contestar.'+(f.type==='text'?' Enter añade un párrafo; Ctrl + Enter permite avanzar.':' Enter permite avanzar.')}</p></form></section><div class="flowTop"><p class="hint" role="status" id="saved">${storageOK?'Guardado automático en este navegador':'Guardado local no disponible; descarga al finalizar.'}</p><button class="link" id="home">Guardar y salir</button></div></div>`;if(f){const input=document.getElementById(f.id);if(input)input.setAttribute('aria-label',f.label);const legend=document.querySelector('legend');legend.id='heading';legend.tabIndex=-1;}updateProgress();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{const section=Number(b.dataset.section);state.step=section===7?route.length:route.findIndex(q=>q.section===section);save();render(true);});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.step=route.findIndex(q=>q.id===b.dataset.edit);save();render(true);});document.getElementById('home').onclick=()=>{save();welcome();};document.getElementById('back').onclick=()=>{state.step--;save();render(true);};if(f)document.getElementById('clear').onclick=()=>{delete state.answers[f.id];clean();save();render();};const form=document.getElementById('survey');form.addEventListener('input',capture);form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='TEXTAREA'&&(e.ctrlKey||e.metaKey)){e.preventDefault();form.requestSubmit();}else if(e.key==='Enter'&&['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();form.requestSubmit();}});form.onsubmit=e=>{e.preventDefault();if(isReview){state.completedAt=new Date().toISOString();save();complete();return;}state.step++;save();render(true);};if(focus){document.getElementById('heading')?.focus();window.scrollTo(0,0);}}
function capture(e){const t=e.target,f=fields.find(q=>q.id===t.name);if(!f)return;let v=t.value;if(f.type==='multi'){v=Array.isArray(val(f.id))?[...val(f.id)]:[];v=t.checked?[...new Set([...v,t.value])]:v.filter(x=>x!==t.value);if(f.exclusive){if(t.checked&&t.value===f.exclusive)v=[t.value];else v=v.filter(x=>x!==f.exclusive);}if(v.length>(f.max||99)){t.checked=false;document.getElementById('error').textContent='Selecciona un máximo de '+f.max+' opciones. Puedes continuar sin responder.';return;}}state.answers[f.id]=v;clean();save();if(f.type==='multi'){document.getElementsByName(f.id).forEach(el=>el.checked=has(f.id,el.value));}updateProgress();const route=fields.filter(visible);document.querySelector('.progressText span').textContent='Pregunta '+(state.step+1)+' de '+route.length;document.getElementById('error').textContent='';}

try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(data.version===VERSION&&data.answers&&typeof data.answers==='object'&&!Array.isArray(data.answers)){state=data;state.step=Math.max(0,Math.min(fields.filter(visible).length,Number(data.step)||0));clean();}}}catch(e){storageOK=false;}
// Abrir siempre la primera pregunta sin borrar las respuestas guardadas.
state.step=0;
state.completedAt=null;
render(true);

</script>
</body></html>
